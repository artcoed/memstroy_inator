# Demo: actor with a cap attached to the head anchor.
# Prerequisites:
#   1. Download clip: memstroy download --max-pages 2 --out assets/mellstroy
#   2. Detect pose: (run pose detection to generate 919.anchors.json)
#   3. Place a cap PNG at assets/props/cap.png
#   4. Render: memstroy render examples/attachment_demo.scene.yaml -o out.mp4 --assets .
format_version: 1

output:
  resolution: [1080, 1920]
  fps: 60
  duration: 8.0
  background_color: [240, 240, 240]

backgrounds:
  - id: bg
    source:
      type: solid_color
      color: [240, 240, 240]
    start: 0.0
    duration: 8.0
    fit: cover
    transition: cut

actors:
  - id: mellstroy_919
    source: "assets/mellstroy/919.mp4"
    anchors: "assets/mellstroy/919.anchors.json"
    chroma_key:
      key_color: [0, 177, 64]
      similarity: 0.20
      blend: 0.10
      spill: 0.30
    layout:
      - t: 0.0
        value: { pos: [0.5, 0.65], scale: 0.85 }
        easing: linear
    t_in: null
    t_out: null
    source_start: 0.0
    loop_source: true
    flip_horizontal: false
    attachments:
      - id: cap
        asset: "assets/props/cap.png"
        anchor: head
        offset: [0.0, -40.0]
        scale: 0.3
        rotation_deg: 0.0
        follow_rotation: false
        z_above_actor: true

overlays:
  - type: text
    id: title
    text: "ИМБА В КЕПКЕ"
    t_in: 0.5
    t_out: 7.5
    style:
      font: DejaVuSans
      font_size: 120.0
      color: [0, 0, 0]
      box_color: [255, 255, 255]
      box_padding: 20.0
      bold: true
      align: center
    layout:
      - t: 0.0
        value: { pos: [0.5, 0.10], scale: 1.0, rotation_deg: 0.0, opacity: 1.0 }

audio: []

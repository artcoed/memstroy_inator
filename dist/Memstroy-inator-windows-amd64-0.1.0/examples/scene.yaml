# Example memstroy scene. Render with:
#   cargo run -p memstroy-cli -- render examples/scene.yaml -o out.mp4 --assets .
format_version: 1

output:
  resolution: [1080, 1920]
  fps: 60
  duration: 8.0
  background_color: [240, 240, 240]

backgrounds:
  - id: street
    source:
      type: solid_color
      color: [240, 240, 240]
    start: 0.0
    duration: 4.0
    fit: cover
    transition: cut
  - id: club
    source:
      type: solid_color
      color: [20, 20, 30]
    start: 4.0
    duration: 4.0
    fit: cover
    transition: snap

camera: []

actors: []

overlays:
  - type: text
    id: title
    text: "Имба"
    t_in: 0.5
    t_out: 7.5
    style:
      font: DejaVuSans
      font_size: 160.0
      color: [0, 0, 0]
      box_color: [255, 255, 255]
      box_padding: 24.0
      bold: true
      align: center
    layout:
      - t: 0.0
        value:
          pos: [0.5, 0.18]
          scale: 1.0
          rotation_deg: 0.0
          opacity: 1.0
        easing: linear

audio: []

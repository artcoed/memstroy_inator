[workspace]
resolver = "2"
members = [
    "crates/memstroy-core",
    "crates/memstroy-tg",
    "crates/memstroy-vision",
    "crates/memstroy-render",
    "crates/memstroy-cli",
    "crates/memstroy-gui",
    "crates/memstroy-assets-server",
]
# По умолчанию собираем всё кроме сервера (сервер только на Railway).
# GUI собирается с feature "local-server" для dev-режима, но клиентские
# сборки (scripts/package-client.ps1) явно отключают эту фичу.
default-members = [
    "crates/memstroy-core",
    "crates/memstroy-tg",
    "crates/memstroy-vision",
    "crates/memstroy-render",
    "crates/memstroy-cli",
    "crates/memstroy-gui",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Memstroy-inator contributors"]
repository = "https://github.com/artcoed/memstroy_generator"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process", "sync", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip"] }
scraper = "0.20"
url = "2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
futures = "0.3"
indicatif = "0.17"
async-trait = "0.1"
regex = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
ndarray = "0.16"
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "alternative-backend"] }

# GUI stack (egui/eframe)
egui = "0.28"
eframe = { version = "0.28", default-features = false, features = ["glow", "wgpu", "default_fonts", "wayland", "x11"] }
egui_extras = { version = "0.28", features = ["image", "all_loaders"] }
rfd = "0.14"
wgpu = "22"
rodio = { version = "0.19", features = [
    # Default codecs (mp3 / vorbis / flac / wav) plus the symphonia-backed
    # MP4 / AAC decoder so audio rips out of `*.mp4` clips automatically.
    # Without `symphonia-isomp4` rodio bails on MP4 containers with
    # "Unrecognized format" even when the inner stream is a standard AAC
    # audio track — which is what most editor-imported clips look like.
    "symphonia-isomp4",
    "symphonia-aac",
    "symphonia-mp3",
    "symphonia-vorbis",
    "symphonia-wav",
    "symphonia-flac",
] }

# Internal crates
memstroy-core = { path = "crates/memstroy-core" }
memstroy-tg = { path = "crates/memstroy-tg" }
memstroy-vision = { path = "crates/memstroy-vision" }
memstroy-render = { path = "crates/memstroy-render" }
memstroy-assets-server = { path = "crates/memstroy-assets-server" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# ── Client-distribution hardening (Level 1) ──
# These knobs target the binary the user ships to clients (via
# `scripts/package-client.{sh,ps1}`); they are intentionally global so
# every `cargo build --release` benefits — there is no scenario where
# a debug-info-laden, unstripped release artefact is desirable.
#
# - `strip = "symbols"` drops the symbol table from the final ELF /
#   PE, removing fn names, file paths and most reflection data. The
#   packaging scripts additionally run `strip --strip-all` (Linux) /
#   `editbin` (Windows) as belt-and-braces.
# - `debug = false` / `debug-assertions = false` ensure no DWARF
#   sections and no panic-message strings about expected invariants
#   leak into the artefact.
# - `panic = "abort"` removes the unwinder, which both shrinks the
#   binary and erases the elaborate panic-formatting machinery (file
#   paths, line numbers, type names of dropped values) from `strings(1)`.
# - `overflow-checks = false` is the standard release setting; spelled
#   out here so a future toolchain default flip can't quietly re-enable
#   them in client builds.
# - `incremental = false` avoids leaking incremental compilation
#   metadata into the artefact path the linker references.
strip = "symbols"
debug = false
debug-assertions = false
overflow-checks = false
panic = "abort"
incremental = false

# Railway deployment configuration for memstroy-assets-server.
#
# - The container builds via Nixpacks (Rust auto-detected from Cargo.toml).
# - We bind the assets-server binary as the start command.
# - PORT is injected by Railway; main.rs honours it.
# - At runtime Railway exposes RAILWAY_VOLUME_MOUNT_PATH for the attached
#   Volume. The server uses it automatically unless ASSETS_ROOT points
#   inside the same mounted volume.

[build]
builder = "nixpacks"
buildCommand = "cargo build --release -p memstroy-assets-server"

[deploy]
startCommand = "./target/release/memstroy-assets-server"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5

[[services]]
name = "memstroy-assets-server"

[services.variables]
RUST_LOG = "info,memstroy_assets_server=info"
MEMSTROY_STORAGE_BACKEND = "bucket"
MEMSTROY_BUCKET_PRESIGN_SECS = "3600"

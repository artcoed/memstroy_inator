[package]
name = "memstroy-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "egui/eframe editor for memstroy-inator scenes"
# `build.rs` bakes two compile-time signals into the binary: the
# obfstr-wrapped default assets-server URL, and a flag that flips the
# editor between developer defaults (cwd-relative `./assets/`,
# in-process server bootstrap) and client-distribution defaults
# (per-user cache dir, remote-only server). See `build.rs` for details.
build = "build.rs"

[[bin]]
name = "memstroy-gui"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true }
egui_extras = { workspace = true }
rfd = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
image = { workspace = true }
chrono = { workspace = true }
memstroy-core = { workspace = true }
memstroy-render = { workspace = true }
memstroy-assets-server = { workspace = true }
wgpu = { workspace = true }
rodio = { workspace = true }
# HTTP client for the shared asset server. Keep the same TLS backend
# the rest of the workspace uses so we don't pull a second one in.
# `json` is enabled here (only in the GUI crate) for the shared library
# panel — the rest of the workspace doesn't pay for serde_json wiring.
reqwest = { workspace = true, features = ["json"] }
# System clipboard access. Used to honour Ctrl+V on the canvas: when
# the OS clipboard contains an image (e.g. a screenshot or a
# "copy image" from the browser), we save it into the project's image
# library, add an Overlay::Image at the playhead, and route to the
# first empty video lane (or a freshly-spawned one). The `image-data`
# feature pulls in the `get_image` API; the rest of the default
# features (notification icon helpers etc.) are not needed.
arboard = { version = "3", default-features = false, features = ["image-data"] }
# Compile-time string obfuscation. Used by `build_info.rs` (and the
# generated `$OUT_DIR/build_info.rs`) to XOR-encode the default
# assets-server URL so `strings(1)` over a shipped binary does not
# reveal the operator's backend address. This is a defence-in-depth
# measure — the string is still recoverable by anyone running the
# binary under a debugger — but it eliminates the trivial
# "grep the artefact" attack and matches Level-1 hardening.
obfstr = "0.4"

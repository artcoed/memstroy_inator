[package]
name = "memstroy-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "egui/eframe editor for memstroy_generator scenes"

[[bin]]
name = "memstroy-gui"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true }
egui_extras = { workspace = true }
rfd = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
image = { workspace = true }
chrono = { workspace = true }
memstroy-core = { workspace = true }
memstroy-tg = { workspace = true }
memstroy-render = { workspace = true }
memstroy-vision = { workspace = true }
wgpu = { workspace = true }
rodio = { workspace = true }
# HTTP client for the shared asset server. Keep the same TLS backend
# the rest of the workspace uses so we don't pull a second one in.
# `json` is enabled here (only in the GUI crate) for the shared library
# panel — the rest of the workspace doesn't pay for serde_json wiring.
reqwest = { workspace = true, features = ["json"] }

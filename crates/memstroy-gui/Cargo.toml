[package]
name = "memstroy-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "egui/eframe editor for Memstroy-inator scenes"
# `build.rs` bakes two compile-time signals into the binary: the
# obfstr-wrapped default assets-server URL, and a flag that flips the
# editor between developer defaults (cwd-relative `./assets/`,
# in-process server bootstrap) and client-distribution defaults
# (per-user cache dir, remote-only server). See `build.rs` for details.
build = "build.rs"

[features]
# Default: enable local-server for development. Client builds (via
# `scripts/package-client.ps1`) explicitly pass `--no-default-features`
# to exclude the heavy `memstroy-assets-server` dependency tree.
default = ["local-server"]

# Enable local assets-server bootstrap for development. Client builds
# (via `scripts/package-client.ps1`) do NOT enable this feature, so
# the heavy `memstroy-assets-server` dependency (and its transitive
# deps like `axum`, `tower-http`, `scraper` via `memstroy-tg`) are
# excluded from the client binary entirely. This cuts build time and
# binary size for shipped artefacts.
local-server = ["dep:memstroy-assets-server"]

# Wrap the compile-time-baked assets-server URL through `obfstr` so
# its bytes are XOR-encoded in the .rdata segment instead of sitting
# there as plain ASCII. This is *defence in depth only* — anyone with
# a debugger recovers the URL trivially — and the XOR-decode loop it
# leaves in the binary is part of what trips Microsoft Defender's
# Wacatac.B!ml / Skyhigh's BehavesLike.ObfuscatedPoly heuristics on
# unsigned setups, so it is OFF by default. Pass
# `--features obfuscate-server-url` to the packaging scripts when you
# want the obfuscation back.
obfuscate-server-url = ["dep:obfstr"]

[lib]
name = "memstroy_gui"
path = "src/lib.rs"

[[bin]]
name = "memstroy-gui"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true }
egui_extras = { workspace = true }
rfd = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
image = { workspace = true }
chrono = { workspace = true }
memstroy-core = { workspace = true }
memstroy-render = { workspace = true }
memstroy-vision = { workspace = true }
memstroy-assets-server = { workspace = true, optional = true }
wgpu = { workspace = true }
rodio = { workspace = true }
# HTTP client for the shared asset server. Keep the same TLS backend
# the rest of the workspace uses so we don't pull a second one in.
# `json` is enabled here (only in the GUI crate) for the shared library
# panel — the rest of the workspace doesn't pay for serde_json wiring.
reqwest = { workspace = true, features = ["json"] }
# System clipboard access. Used to honour Ctrl+V on the canvas: when
# the OS clipboard contains an image (e.g. a screenshot or a
# "copy image" from the browser), we save it into the project's image
# library, add an Overlay::Image at the playhead, and route to the
# first empty video lane (or a freshly-spawned one). The `image-data`
# feature pulls in the `get_image` API; the rest of the default
# features (notification icon helpers etc.) are not needed.
arboard = { version = "3", default-features = false, features = ["image-data"] }
# Compile-time string obfuscation. Used by `build_info.rs` (and the
# generated `$OUT_DIR/build_info.rs`) to XOR-encode the default
# assets-server URL so `strings(1)` over a shipped binary does not
# reveal the operator's backend address. This is a defence-in-depth
# measure — the string is still recoverable by anyone running the
# binary under a debugger — but it eliminates the trivial
# "grep the artefact" attack and matches Level-1 hardening.
#
# Gated behind the `obfuscate-server-url` feature: leaving the
# XOR-decode loop in default release builds was a major contributor
# to AV false positives on the unsigned Setup.exe (Microsoft's
# `Wacatac.B!ml`, Skyhigh's `BehavesLike.ObfuscatedPoly`). Opt back
# in via `cargo build --features obfuscate-server-url` when needed.
obfstr = { version = "0.4", optional = true }
# TTF/OTF face name extraction. Used by `system_fonts.rs` to read the
# `name` table of every TTF/OTF on disk so the font picker / canvas
# preview show real family names ("Arial", "Inter", …) instead of just
# the file stem ("ARIALBD"). `ttf-parser` is already transitively
# present in the egui graph, so the binary cost is essentially zero.
ttf-parser = "0.25"
# Font byte-stream validator. Used by `system_fonts::ensure_font_loaded`
# to reject malformed TTFs *before* they reach `ctx.set_fonts(...)`.
# egui's text layout uses ab_glyph internally; pre-flighting with the
# same parser avoids the panic-on-bad-font crash users were hitting
# when the picker accepted a system font that ttf-parser tolerated but
# ab_glyph did not. Already present transitively via memstroy-render
# / egui, so this is just an explicit re-export with no extra cost.
ab_glyph = "0.2"
# Portable SIMD (AVX2 / SSE / NEON) for the chroma-key + colour-correction
# pipeline. Auto-detects the best instruction set at runtime via `wide`.
wide = "0.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

# `winresource` programmatically generates and links a Win32
# VS_VERSIONINFO resource into the produced `.exe`, populating the
# Properties → Details tab with CompanyName / FileDescription /
# ProductName / FileVersion etc. A blank VersionInfo block is itself
# a heuristic signal for AV ML models on unsigned PEs, so populating
# it is one of the cheapest ways to lower the VirusTotal false-
# positive rate without paying for a code-signing certificate.
#
# Lives under `[target.'cfg(windows)'.build-dependencies]` so it is
# only resolved when actually targeting Windows; cross-builds from
# Linux / macOS for any other target ignore it entirely.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

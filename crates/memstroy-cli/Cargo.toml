[package]
name = "memstroy-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "CLI for memstroy_generator"

[[bin]]
name = "memstroy"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs", "process", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
memstroy-core = { workspace = true }
memstroy-tg = { workspace = true }
memstroy-render = { workspace = true }
memstroy-vision = { workspace = true }

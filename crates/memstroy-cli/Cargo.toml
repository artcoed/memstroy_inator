[package]
name = "memstroy-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "CLI for Memstroy-inator"

[[bin]]
name = "memstroy"
path = "src/main.rs"

[features]
# Default: include Telegram scraping functionality for full CLI experience.
# Client builds can disable this with --no-default-features to exclude
# heavy dependencies (scraper, reqwest with rustls, etc.).
default = ["telegram"]

# Enable Telegram channel scraping via the `download` subcommand.
# Pulls in memstroy-tg and its heavy dependency tree (scraper, reqwest).
telegram = ["dep:memstroy-tg"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs", "process", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
memstroy-core = { workspace = true }
memstroy-tg = { workspace = true, optional = true }
memstroy-render = { workspace = true }
memstroy-vision = { workspace = true }

[phases.setup]
# Ensure ffmpeg is available in Railway/Nixpacks runtime.
# Defining a custom setup phase disables some auto-detection, so we
# explicitly include the Rust toolchain too.
nixPkgs = ["cargo", "rustc", "ffmpeg"]

[phases.build]
cmds = ["cargo build --release -p memstroy-assets-server"]

[start]
cmd = "./target/release/memstroy-assets-server --root ${ASSETS_ROOT:-/data/assets}"

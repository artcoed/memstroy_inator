[phases.setup]
# Extend (do not override) provider packages, and add ffmpeg.
# The "..." placeholder preserves Nixpacks' auto-detected Rust toolchain.
nixPkgs = ["...", "ffmpeg"]

[phases.build]
cmds = ["cargo build --release -p memstroy-assets-server"]

[start]
cmd = "./target/release/memstroy-assets-server --root ${ASSETS_ROOT:-/data/assets}"

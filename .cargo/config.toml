# Workspace-wide cargo aliases for the most common workflows.
#
# - `cargo gui`            — run the editor (debug build, fastest feedback).
# - `cargo gui-release`    — run the editor (release build, audio + GPU realistic).
# - `cargo server`         — run the standalone assets-server in release mode
#                            on the default 0.0.0.0:8765 / ./assets root.
# - `cargo dev-server`     — same, in debug mode.
# - `cargo cli`            — invoke the CLI binary; pass subcommand args after `--`.
#
# Custom packaging lives in `scripts/package-client.{sh,ps1}` because it
# needs filesystem operations cargo aliases can't express.

[alias]
gui          = "run -p memstroy-gui --release"
gui-debug    = "run -p memstroy-gui"
server       = "run -p memstroy-assets-server --release --"
dev-server   = "run -p memstroy-assets-server --"
cli          = "run -p memstroy-cli --release --"
